<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Proof - Descubre y Califica</title>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- FontAwesome Iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Html5-QRCode Lector -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <!-- Google Fonts (Outfit) -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-base: #F6f4F1; 
      --primary: #0F3473; 
      --glass-bg: rgba(246, 244, 241, 0.85);
      --white: #FFFFFF;
      --success: #4CAF50;
      --danger: #F44336;
      --shadow-soft: 0 10px 30px rgba(15, 52, 115, 0.08);
      --shadow-hover: 0 16px 40px rgba(15, 52, 115, 0.15);
      --shadow-btn: 0 6px 20px rgba(15, 52, 115, 0.2);
      --transition-smooth: all 0.4s ease-in-out;
      --transition-fast: all 0.2s ease-out;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: var(--bg-base); color: var(--primary); }

    /* === ANIMACIONES GLOBALES === */
    @keyframes slideUpFade { 0% { opacity: 0; transform: translateY(30px); } 100% { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes popIn { 0% { opacity: 0; transform: scale(0.6) translateY(15px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
    
    .fade-in { animation: fadeIn 0.5s ease-out forwards; }
    .slide-up { animation: slideUpFade 0.5s ease-out forwards; opacity: 0; }
    .pop-in { animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }

    /* === MAPA === */
    #map { width: 100%; height: 100vh; z-index: 1; background-color: var(--bg-base); }
    .leaflet-container { background: var(--bg-base); }
    .leaflet-tile-pane { filter: grayscale(100%) sepia(10%) contrast(1.1) brightness(1.05); opacity: 0.75; }
    .leaflet-control-attribution { display: none; }

    /* === PINES BLINDADOS === */
    .custom-photo-pin { background: transparent; border: none; outline: none; }
    .photo-pin-img {
      width: 56px; height: 56px; border-radius: 18px; 
      box-shadow: 0 8px 24px rgba(15,52,115,0.3); 
      background-size: cover; background-position: center; 
      background-color: var(--white);
      transition: transform 0.2s ease;
    }
    .photo-pin-img:active { transform: scale(0.85); }
    .status-dot {
      position: absolute; top: -6px; right: -6px; width: 18px; height: 18px;
      border-radius: 50%; border: 3px solid var(--bg-base); z-index: 10;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    /* === HEADER SUPERIOR === */
    .top-header { position: absolute; top: 40px; left: 0; right: 0; z-index: 1000; display: flex; justify-content: center; align-items: center; pointer-events: none; }
    .header-center-img { height: 48px; width: auto; max-width: 60%; object-fit: contain; pointer-events: auto; filter: drop-shadow(0 6px 12px rgba(15,52,115,0.15)); transition: transform 0.3s ease; }
    .header-center-img:active { transform: scale(0.95); }

    /* === BARRA VERTICAL RETRÁCTIL (MATEMÁTICA PERFECTA) === */
    .toolbar-wrapper { 
      position: absolute; 
      right: 16px; /* Posición visible */
      top: 50%; 
      margin-top: -120px; /* Centrado absoluto infalible */
      z-index: 1000; display: flex; align-items: center; 
      transition: right 0.4s ease-in-out; 
    }
    .toolbar-wrapper.hidden { 
      right: -70px; /* Esconde toda la barra (60px) + la sombra (10px) = 70px fuera de la pantalla */
    }
    
    .toggle-toolbar-btn { 
      background: var(--white); border: 1px solid rgba(15,52,115,0.05); color: var(--primary); 
      width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; 
      cursor: pointer; box-shadow: var(--shadow-soft); z-index: 1001; 
      position: absolute; 
      left: -32px; /* Al esconderse -70px, estos -32px garantizan que la flecha asome exactamente por la mitad en cualquier celular */
      font-size: 1.1rem; transition: var(--transition-smooth); 
    }
    .toggle-toolbar-btn:active { transform: scale(0.85); }
    
    .vertical-toolbar { display: flex; flex-direction: column; align-items: center; gap: 20px; background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.4); padding: 22px 14px; border-radius: 35px; box-shadow: var(--shadow-soft); width: 60px; }
    .tool-btn { background: transparent; border: none; color: var(--primary); font-size: 1.5rem; cursor: pointer; transition: var(--transition-fast); display: flex; align-items: center; justify-content: center; opacity: 0.8; }
    .tool-btn:hover { opacity: 1; transform: scale(1.1); }
    .tool-btn:active { transform: scale(0.8); }

    /* Botones Generales */
    .btn { padding: 18px 26px; border: none; border-radius: 30px; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 10px; font-size: 1.05rem; transition: var(--transition-smooth); box-shadow: var(--shadow-soft); }
    .btn:active { transform: scale(0.94); box-shadow: none; }
    .btn-primary { background: var(--primary); color: var(--white); box-shadow: var(--shadow-btn); }
    .btn-secondary { background: var(--bg-base); color: var(--primary); border: 2px solid var(--primary); box-shadow: none; }

    /* Drawer Menú */
    .drawer-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,52,115,0.3); backdrop-filter: blur(4px); z-index: 2000; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; }
    .drawer-overlay.active { opacity: 1; pointer-events: all; }
    .drawer { position: fixed; top: 0; left: -350px; width: 320px; height: 100%; background: var(--bg-base); z-index: 2001; transition: left 0.5s ease; display: flex; flex-direction: column; padding: 40px 24px; border-radius: 0 40px 40px 0; box-shadow: 15px 0 40px rgba(15,52,115,0.1); }
    .drawer.active { left: 0; } 
    .drawer-item { padding: 18px; background: var(--white); border-radius: 20px; font-weight: 800; display: flex; align-items: center; gap: 14px; margin-bottom: 14px; color: var(--primary); cursor: pointer; box-shadow: 0 4px 12px rgba(15,52,115,0.03); border: 1px solid rgba(15,52,115,0.04); font-size: 1.05rem; transition: var(--transition-smooth); }
    .drawer-item:active { transform: scale(0.97); }

    /* Modales Flotantes */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,52,115,0.4); backdrop-filter: blur(8px); z-index: 3000; display: flex; justify-content: center; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; }
    .modal-overlay.active { opacity: 1; pointer-events: all; }
    .modal-card { width: 100%; max-height: 90vh; border-radius: 40px 40px 0 0; display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); background: var(--bg-base); box-shadow: 0 -15px 50px rgba(15,52,115,0.15); }
    .modal-overlay.active .modal-card { transform: translateY(0); }
    .modal-header { padding: 30px 30px 20px; display: flex; justify-content: space-between; align-items: center; }
    .modal-header h3 { font-size: 1.6rem; font-weight: 900; color: var(--primary); letter-spacing: -0.5px; }
    .btn-close { background: rgba(15,52,115,0.05); border: none; color: var(--primary); width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; }
    .modal-body { padding: 0 30px 30px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }

    /* Formularios */
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 18px 24px; border: 2px solid transparent; border-radius: 24px; background: var(--white); font-weight: 600; margin-bottom: 16px; font-size: 1.05rem; color: var(--primary); outline: none; transition: var(--transition-smooth); box-shadow: 0 4px 12px rgba(15,52,115,0.03); appearance: none; }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--primary); box-shadow: var(--shadow-soft); }

    /* === FICHA DEL LOCAL: MINIATURAS (THUMBNAILS) CON BLOQUEO === */
    .biz-carousel-container { 
      display: flex; overflow-x: auto; gap: 14px; padding-bottom: 12px; 
      scrollbar-width: none; -webkit-overflow-scrolling: touch; margin-top: 5px; 
      min-height: 90px; flex-shrink: 0; width: 100%;
    }
    .biz-carousel-container::-webkit-scrollbar { display: none; }
    .biz-carousel-item { 
      flex: 0 0 85px; height: 85px; border-radius: 22px; 
      box-shadow: 0 6px 16px rgba(15,52,115,0.15); cursor: zoom-in; overflow: hidden; 
      background-color: var(--white); background-size: cover; background-position: center; 
      border: 2px solid var(--white); flex-shrink: 0; /* Esto bloquea el CSS para que la tarjeta de abajo no se superponga jamás */
    }

    /* REDES SOCIALES */
    .social-links-container { display: flex; gap: 12px; margin-bottom: 16px; padding: 0 4px; flex-wrap: wrap; flex-shrink: 0; }
    .social-link { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 14px; color: var(--white); font-size: 1.4rem; text-decoration: none; box-shadow: 0 4px 10px rgba(0,0,0,0.15); transition: transform 0.2s; }
    .social-link:active { transform: scale(0.85); }
    .social-wa { background: #25D366; } 
    .social-ig { background: #E1306C; } 
    .social-fb { background: #1877F2; } 
    .social-web { background: var(--primary); } 

    /* LIGHTBOX ZOOM */
    #lightbox { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,52,115,0.95); z-index: 9999; backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease; cursor: zoom-out; }
    #lightbox.active { display: flex; opacity: 1; }
    #lightbox img { max-width: 95vw; max-height: 90vh; border-radius: 20px; object-fit: contain; box-shadow: 0 10px 40px rgba(0,0,0,0.4); transform: scale(0.9); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1); }
    #lightbox.active img { transform: scale(1); }

    /* TARJETA DE INFORMACIÓN (META) */
    .biz-meta { background: var(--white); padding: 26px; border-radius: 30px; font-size: 1.05rem; font-weight: 600; color: var(--primary); box-shadow: var(--shadow-soft); border: 1px solid rgba(15,52,115,0.02); flex-shrink: 0; position: relative; z-index: 2; }
    .biz-meta div { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 16px; line-height: 1.5; }
    .biz-meta i { color: rgba(15,52,115,0.5); width: 20px; font-size: 1.3rem; margin-top: 2px; }

    /* Reseñas */
    .review-card { background: var(--white); border-radius: 30px; padding: 26px; display: flex; flex-direction: column; gap: 14px; margin-bottom: 16px; box-shadow: var(--shadow-soft); flex-shrink: 0; }
    .review-header { display: flex; align-items: center; gap: 16px; }
    .review-header img { width: 56px; height: 56px; border-radius: 18px; object-fit: cover; box-shadow: 0 4px 10px rgba(15,52,115,0.1); }
    .review-author { font-weight: 900; font-size: 1.2rem; }
    .review-media img { width: 100%; border-radius: 20px; margin-top: 10px; object-fit: cover; box-shadow: 0 4px 12px rgba(15,52,115,0.1); cursor: zoom-in; }
    .review-media audio { width: 100%; height: 44px; margin-top: 10px; filter: contrast(0.9); }
    
    /* Wizard (Paso a Paso) */
    .wizard-step { display: none; flex-direction: column; align-items: center; text-align: center; gap: 16px; }
    .wizard-step.active { display: flex; animation: slideUpFade 0.4s ease forwards; }
    .star-rating-picker { font-size: 3.5rem; color: rgba(15,52,115,0.1); display: flex; gap: 14px; margin: 30px 0; }
    .star-rating-picker i { cursor: pointer; transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.3s ease; }
    .star-rating-picker i:active { transform: scale(0.8); }
    .star-rating-picker i.active { color: #F5A623; transform: scale(1.15); filter: drop-shadow(0 4px 8px rgba(245, 166, 35, 0.3)); }
    
    /* Tabs Login */
    .tabs { display: flex; gap: 8px; margin-bottom: 24px; background: rgba(15,52,115,0.05); padding: 8px; border-radius: 40px; }
    .tab { flex: 1; text-align: center; padding: 16px; border-radius: 30px; cursor: pointer; font-weight: 800; color: rgba(15,52,115,0.4); transition: var(--transition-smooth); font-size: 1.05rem; }
    .tab.active { background: var(--white); color: var(--primary); box-shadow: var(--shadow-soft); }
    .form-section { display: none; }
    .form-section.active { display: block; animation: slideUpFade 0.4s ease forwards; }

    /* Toast */
    .toast { position: fixed; top: 40px; left: 50%; transform: translate(-50%, -150px); background: var(--primary); color: var(--white); padding: 18px 36px; border-radius: 40px; z-index: 10000; font-weight: 800; transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); box-shadow: var(--shadow-btn); font-size: 1.05rem; white-space: nowrap; }
    .toast.show { transform: translate(-50%, 0); }
  </style>
</head>
<body>

  <div class="toast" id="toast"></div>

  <!-- LIGHTBOX FOTOS -->
  <div id="lightbox" onclick="window.closeLightbox()">
    <img id="lightbox-img" src="" onclick="event.stopPropagation()">
  </div>

  <!-- HEADER -->
  <header class="top-header fade-in">
    <!-- REEMPLAZA EL SRC CON TU LOGO OFICIAL -->
    <img src="tu_logo.png" onerror="this.src='https://via.placeholder.com/200x60/F6f4F1/0F3473?text=TU+LOGO'" alt="Logo" class="header-center-img">
  </header>

  <!-- MAPA PRINCIPAL -->
  <div id="map" class="fade-in"></div>

  <!-- BARRA VERTICAL RETRÁCTIL (CORREGIDA LA MATEMÁTICA) -->
  <div class="toolbar-wrapper slide-up" id="toolbar-wrapper" style="animation-delay: 0.3s;">
    <button class="toggle-toolbar-btn" onclick="window.toggleToolbar()"><i class="fa-solid fa-chevron-right" id="toolbar-icon"></i></button>
    <div class="vertical-toolbar">
      <button class="tool-btn" onclick="window.openDrawer()"><i class="fa-solid fa-bars"></i></button>
      <button class="tool-btn" onclick="window.openModal('modal-search')"><i class="fa-solid fa-magnifying-glass"></i></button>
      <button class="tool-btn" onclick="window.startQrScanner()"><i class="fa-solid fa-qrcode"></i></button>
      <button class="tool-btn" onclick="window.centerToUser()"><i class="fa-solid fa-location-crosshairs"></i></button>
    </div>
  </div>

  <!-- MENÚ HAMBURGUESA -->
  <div class="drawer-overlay" id="drawer-overlay" onclick="window.closeDrawer()"></div>
  <div class="drawer" id="drawer">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:40px;">
      <h3 style="color:var(--primary); font-weight:900; font-size:1.6rem;">MENÚ</h3>
      <button class="btn-close" onclick="window.closeDrawer()"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <div id="drawer-user-profile" class="slide-up" style="background:var(--white); padding:30px; border-radius:35px; text-align:center; margin-bottom:24px; display:none; box-shadow:var(--shadow-soft);">
      <img id="drawer-avatar" src="" style="width:90px; height:90px; border-radius:30px; margin:0 auto 16px; object-fit:cover; border:3px solid var(--primary);">
      <div id="drawer-username" style="font-weight:900; font-size:1.4rem;"></div>
    </div>

    <div class="drawer-item" onclick="window.handleMenuProfile()">
      <i class="fa-solid fa-user-circle" style="font-size:1.4rem;"></i> <span id="menu-text-auth">Mi Perfil / Registro</span>
    </div>
    <div class="drawer-item" id="menu-btn-logout" style="display:none; color:#D9534F;" onclick="window.logoutUser()">
      <i class="fa-solid fa-right-from-bracket" style="font-size:1.4rem;"></i> Cerrar Sesión
    </div>
  </div>

  <!-- MODAL: MI PERFIL -->
  <div class="modal-overlay" id="modal-profile">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Mi Perfil</h3>
        <button class="btn-close" onclick="window.closeModal('modal-profile')"><i class="fa-solid fa-chevron-down"></i></button>
      </div>
      <div class="modal-body" style="padding-bottom: 50px;">
        <h4 style="font-weight:900; margin-bottom:10px;">Mis Proofs Guardados</h4>
        <div id="my-reviews-list" style="display:flex; flex-direction:column; gap:16px;"></div>
      </div>
    </div>
  </div>

  <!-- MODAL: BÚSQUEDA Y FILTROS -->
  <div class="modal-overlay" id="modal-search">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Explorar Locales</h3>
        <button class="btn-close" onclick="window.closeModal('modal-search')"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body" style="padding-bottom: 50px;">
        <div class="form-group slide-up" style="animation-delay: 0.1s;">
          <select id="filter-cat" onchange="window.renderMapPins(); window.closeModal('modal-search');">
            <option value="ALL">Todas las Categorías</option>
            <option value="Gastronomía">Gastronomía</option>
            <option value="Servicios">Servicios</option>
            <option value="Comercio">Tiendas / Comercios</option>
          </select>
        </div>
        <div class="form-group slide-up" style="animation-delay: 0.2s;">
          <input type="text" id="filter-text" placeholder="Buscar por nombre..." oninput="window.renderMapPins()">
        </div>
        <button class="btn btn-primary slide-up" style="width:100%; animation-delay: 0.3s;" onclick="window.closeModal('modal-search')">Ver Resultados</button>
      </div>
    </div>
  </div>

  <!-- MODAL: FICHA DEL LOCAL -->
  <div class="modal-overlay" id="modal-biz">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="biz-title" class="fade-in">Local</h3>
        <button class="btn-close" onclick="window.closeModal('modal-biz')"><i class="fa-solid fa-chevron-down"></i></button>
      </div>
      <div class="modal-body">
        
        <!-- CARRUSEL DE MINIATURAS (THUMBNAILS) -->
        <div id="biz-photos-carousel" class="biz-carousel-container slide-up"></div>
        
        <!-- REDES SOCIALES A COLOR -->
        <div id="biz-social-links" class="social-links-container slide-up" style="animation-delay: 0.05s;"></div>
        
        <!-- METADATA -->
        <div class="biz-meta slide-up" style="animation-delay: 0.1s;">
          <div><i class="fa-solid fa-quote-left"></i> <span id="biz-desc"></span></div>
          <div><i class="fa-solid fa-clock"></i> <span id="biz-hours"></span></div>
          <div><i class="fa-solid fa-location-dot"></i> <span id="biz-address"></span></div>
        </div>

        <button class="btn btn-primary slide-up" style="width:100%; margin-top:10px; animation-delay: 0.2s;" onclick="window.startReviewWizard()">
          <i class="fa-solid fa-star"></i> Dejar un Proof
        </button>

        <h4 class="slide-up" style="margin-top:24px; font-weight:900; font-size:1.5rem; animation-delay: 0.3s;">Evidencias de Usuarios</h4>
        <div id="biz-reviews-list" style="display:flex; flex-direction:column; padding-bottom:50px;"></div>
      </div>
    </div>
  </div>

  <!-- MODAL: LOGIN / REGISTRO -->
  <div class="modal-overlay" id="modal-auth">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Identificación</h3>
        <button class="btn-close" onclick="window.closeModal('modal-auth')"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body" style="padding-bottom:50px;">
        <div class="tabs">
          <div id="tab-login" class="tab active" onclick="window.switchAuthTab('login')">Ingresar</div>
          <div id="tab-register" class="tab" onclick="window.switchAuthTab('register')">Crear Cuenta</div>
        </div>

        <div id="loginForm" class="form-section active">
          <div class="form-group"><input type="email" id="loginEmail" placeholder="Correo electrónico"></div>
          <div class="form-group"><input type="password" id="loginPassword" placeholder="Contraseña"></div>
          <button class="btn btn-primary" style="width:100%; margin-top:10px;" onclick="window.loginUser()">Entrar</button>
        </div>

        <div id="registerForm" class="form-section">
          <div class="form-group"><input type="text" id="regName" placeholder="Nombre completo"></div>
          <div class="form-group"><input type="email" id="regEmail" placeholder="Correo electrónico"></div>
          <div class="form-group"><input type="password" id="regPassword" placeholder="Contraseña (mín 6)"></div>
          <label class="btn btn-secondary" style="width:100%; margin-bottom:16px;">
            <i class="fa-solid fa-camera"></i> Subir Foto de Perfil
            <input type="file" id="regPhoto" accept="image/*" style="display:none;">
          </label>
          <button class="btn btn-primary" style="width:100%;" onclick="window.registerUser()">Comenzar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL: WIZARD RESEÑAS -->
  <div class="modal-overlay" id="modal-wizard">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Tu Experiencia</h3>
        <button class="btn-close" onclick="window.closeModal('modal-wizard')"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body" style="padding-bottom:50px;">
        
        <div id="wiz-step-1" class="wizard-step active">
          <h4 style="font-size:1.4rem; font-weight:900;">¿Cómo calificarías este local?</h4>
          <div class="star-rating-picker" id="star-picker">
            <i class="fa-solid fa-star" data-val="1"></i><i class="fa-solid fa-star" data-val="2"></i>
            <i class="fa-solid fa-star" data-val="3"></i><i class="fa-solid fa-star" data-val="4"></i>
            <i class="fa-solid fa-star" data-val="5"></i>
          </div>
          <button class="btn btn-primary" style="width:100%;" onclick="window.nextWizardStep(2)">Continuar</button>
        </div>

        <div id="wiz-step-2" class="wizard-step">
          <h4 style="font-size:1.4rem; font-weight:900;">Escribe tu opinión</h4>

          <div style="display:flex; gap:16px; width:100%;"><button class="btn btn-secondary" style="flex:1;" onclick="window.nextWizardStep(4)">Saltar</button><button class="btn btn-primary" style="flex:1;" onclick="window.nextWizardStep(4)">Siguiente</button></div>

          <h4 style="font-size:1.4rem; font-weight:900;">Graba un audio rápido</h4>
          <button class="btn btn-secondary" id="btn-wiz-audio" style="width:100%; padding:24px; border:2px dashed var(--primary);" onclick="window.toggleWizAudio()"><i class="fa-solid fa-microphone"></i> Iniciar Grabación</button>
          <audio id="wiz-audio-preview" controls style="width:100%; display:none; margin-top:20px;"></audio>
          <button class="btn btn-primary" style="width:100%; margin-top:40px; font-size:1.2rem; padding:20px;" id="btn-wiz-submit" onclick="window.submitWizardReview()">Publicar Proof <i class="fa-solid fa-paper-plane"></i></button>
        </div>

      </div>
    </div>
  </div>

  <!-- Modal QR Lector -->
  <div class="modal-overlay" id="modal-qr">
    <div class="modal-card">
      <div class="modal-header"><h3>Escanear Código</h3><button class="btn-close" onclick="window.closeModal('modal-qr')"><i class="fa-solid fa-xmark"></i></button></div>
      <div class="modal-body" style="padding-bottom:50px;"><div id="qr-reader" style="border-radius:24px; overflow:hidden; border: 2px solid rgba(15,52,115,0.1);"></div></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";
    import { getDatabase, ref, set, push, onValue } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAhz1XHoprhhrHyYfuAdIYGMJxm5UsDO-4",
      authDomain: "the-pic-c437e.firebaseapp.com",
      databaseURL: "https://the-pic-c437e-default-rtdb.firebaseio.com",
      projectId: "the-pic-c437e",
      storageBucket: "the-pic-c437e.appspot.com",
      messagingSenderId: "750954597180",
      appId: "1:750954597180:web:fc586d73d852ed5e17ec39"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // IMAGEN SEGURA DE REEMPLAZO (ELIMINADO EL SVG ROTO)
    const defaultImg = "https://via.placeholder.com/150/F6f4F1/0F3473?text=Proof";

    let currentUser = null; 
    let userCoords = { lat: -38.0055, lng: -57.5426 }; 
    let map, userMarker;
    let currentMarkers = [];
    let allBusinesses = {}; 
    let selectedBizId = null;
    let html5QrCodeScanner = null;
    let gpsWatcherId = null;

    let wizRating = 0; let mediaRecorder = null; let audioChunks = []; let recordedAudioBase64 = null; let isRecording = false;

    window.addEventListener('DOMContentLoaded', () => {
      initMap();
      setupStarPicker();
      
      onValue(ref(db, 'businesses'), (snapshot) => {
        allBusinesses = snapshot.val() || {};
        window.renderMapPins();
        
        // DEEP LINKING
        const urlParams = new URLSearchParams(window.location.search);
        const bizParam = urlParams.get('biz');
        if (bizParam && allBusinesses[bizParam] && !window.deepLinkOpened) {
          window.deepLinkOpened = true; 
          setTimeout(() => {
            window.openBusinessModal(bizParam);
            window.history.replaceState({}, document.title, window.location.pathname);
          }, 500); 
        }
      });
    });

    /* MAPA Y GPS SAFARI FIX */
    function initMap() {
      map = L.map('map', { zoomControl: false }).setView([userCoords.lat, userCoords.lng], 14);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '' }).addTo(map);

      map.on('dragstart', () => { 
        const tw = document.getElementById('toolbar-wrapper');
        if (!tw.classList.contains('hidden')) window.toggleToolbar();
      });
    }

    window.centerToUser = function() {
      showToast("Buscando señal GPS...");
      
      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition((pos) => {
          userCoords.lat = pos.coords.latitude; 
          userCoords.lng = pos.coords.longitude;
          
          if (!userMarker) {
            const icon = L.divIcon({ className: '', html: "<div style='background:var(--primary); width:20px; height:20px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 10px rgba(15,52,115,0.4);'></div>", iconSize: [20,20] });
            userMarker = L.marker([userCoords.lat, userCoords.lng], { icon, zIndexOffset: 1000 }).addTo(map);
          } else {
            userMarker.setLatLng([userCoords.lat, userCoords.lng]);
          }
          
          map.setView([userCoords.lat, userCoords.lng], 16, {animate: true, duration: 1});
          showToast("¡Ubicación encontrada!");

          if (!gpsWatcherId) {
            gpsWatcherId = navigator.geolocation.watchPosition((p) => {
              userCoords.lat = p.coords.latitude; userCoords.lng = p.coords.longitude;
              if (userMarker) userMarker.setLatLng([userCoords.lat, userCoords.lng]);
            }, (e) => console.log(e), { enableHighAccuracy: true });
          }
        }, (err) => {
          if (err.code === 1) showToast("GPS Denegado por tu navegador. Actívalo en Ajustes.");
          else if (err.code === 2) showToast("Error de señal. Intenta en exteriores.");
          else showToast("Error GPS: " + err.message);
        }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
      } else {
        showToast("Tu navegador no soporta GPS");
      }
    };

    window.toggleToolbar = function() {
      const tw = document.getElementById('toolbar-wrapper');
      const icon = document.getElementById('toolbar-icon');
      tw.classList.toggle('hidden');
      if(tw.classList.contains('hidden')) icon.classList.replace('fa-chevron-right', 'fa-chevron-left');
      else icon.classList.replace('fa-chevron-left', 'fa-chevron-right');
    };

    function fileToBase64Compress(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            try {
              const canvas = document.createElement('canvas');
              const MAX_WIDTH = 600; 
              let scaleSize = 1;
              if (img.width > MAX_WIDTH) scaleSize = MAX_WIDTH / img.width;
              canvas.width = img.width * scaleSize; canvas.height = img.height * scaleSize;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              resolve(canvas.toDataURL('image/jpeg', 0.7)); 
            } catch(err) {
              resolve(e.target.result); 
            }
          };
          img.onerror = () => resolve(e.target.result); 
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function checkIsOpen(openTime, closeTime) {
      if (!openTime || !closeTime) return null;
      const now = new Date();
      const currentMin = now.getHours() * 60 + now.getMinutes();
      const [oH, oM] = openTime.split(':').map(Number);
      const [cH, cM] = closeTime.split(':').map(Number);
      const startMin = oH * 60 + oM;
      const endMin = cH * 60 + cM;
      if (startMin < endMin) return currentMin >= startMin && currentMin <= endMin;
      else return currentMin >= startMin || currentMin <= endMin; 
    }

    /* RENDER DE PINES BLINDADO */
    window.renderMapPins = function() {
      currentMarkers.forEach(m => map.removeLayer(m)); currentMarkers = [];
      const catFilter = document.getElementById('filter-cat').value;
      const textFilter = document.getElementById('filter-text').value.toLowerCase();

      Object.entries(allBusinesses).forEach(([id, b]) => {
        try {
          const lat = parseFloat(b.lat);
          const lng = parseFloat(b.lng);
          const nameStr = b.name ? b.name.toLowerCase() : "";

          if (!isNaN(lat) && !isNaN(lng) && (catFilter === 'ALL' || b.category === catFilter) && nameStr.includes(textFilter)) {
            
            let openBadge = "";
            if (b.openTime && b.closeTime) {
              const isOpenNow = checkIsOpen(b.openTime, b.closeTime);
              const color = isOpenNow ? 'var(--success)' : 'var(--danger)';
              openBadge = `<div class="status-dot" style="background: ${color};"></div>`;
            }

            let imgUrl = defaultImg;
            if (b.photos && b.photos.length > 0) imgUrl = b.photos[0];
            else if (b.photoBase64 && b.photoBase64.trim() !== "") imgUrl = b.photoBase64;
            
            // FILTRO DE SEGURIDAD (Evita iconos rotos [?])
            if (!imgUrl.startsWith('http') && !imgUrl.startsWith('data:image')) imgUrl = defaultImg;
            
            const iconHtml = `
              <div style="display: flex; flex-direction: column; align-items: center;">
                <div class="pin-container">
                  ${openBadge}
                  <div class="photo-pin-img pop-in" style="background-image: url('${imgUrl}');"></div>
                </div>
                <div class="pop-in" style="width: 8px; height: 8px; background: var(--primary); border-radius: 50%; margin-top: 8px; border: 2px solid var(--white); box-shadow: 0 4px 8px rgba(15,52,115,0.4); animation-delay: 0.1s;"></div>
              </div>
            `;
            const icon = L.divIcon({ className: 'custom-photo-pin', html: iconHtml, iconSize: [56, 76], iconAnchor: [28, 76] });
            
            const m = L.marker([lat, lng], { icon }).addTo(map);
            m.on('click', () => window.openBusinessModal(id));
            currentMarkers.push(m);
          }
        } catch(e) { console.error("Local ignorado", e); }
      });
    };

    window.openLightbox = function(url) {
      const lb = document.getElementById('lightbox');
      document.getElementById('lightbox-img').src = url;
      lb.style.display = 'flex';
      setTimeout(() => lb.classList.add('active'), 10);
    };
    window.closeLightbox = function() {
      const lb = document.getElementById('lightbox');
      lb.classList.remove('active');
      setTimeout(() => lb.style.display = 'none', 300);
    };

    /* === FICHA DEL LOCAL CON REDES SOCIALES === */
    window.openBusinessModal = function(id) {
      selectedBizId = id; const biz = allBusinesses[id];
      document.getElementById('biz-title').innerText = biz.name;
      
      const carouselContainer = document.getElementById('biz-photos-carousel');
      carouselContainer.innerHTML = "";
      
      let photosArray = [];
      if (biz.photos && biz.photos.length > 0) photosArray = biz.photos;
      else if (biz.photoBase64) photosArray = [biz.photoBase64];
      else photosArray = [defaultImg];

      photosArray.forEach(imgStr => {
        let safeUrl = imgStr;
        if (!safeUrl.startsWith('http') && !safeUrl.startsWith('data:image')) safeUrl = defaultImg;
        
        const item = document.createElement('div');
        item.className = 'biz-carousel-item';
        item.style.backgroundImage = `url('${safeUrl}')`;
        item.onclick = () => window.openLightbox(safeUrl);
        carouselContainer.appendChild(item);
      });
      
      // INYECTAR REDES SOCIALES A COLOR
      const socialContainer = document.getElementById('biz-social-links');
      socialContainer.innerHTML = "";
      let socialHtml = "";
      
      if (biz.whatsapp) {
        let waLink = biz.whatsapp.replace(/[^0-9]/g, '');
        if(waLink) socialHtml += `<a href="https://wa.me/${waLink}" target="_blank" class="social-link social-wa"><i class="fa-brands fa-whatsapp"></i></a>`;
      }
      if (biz.instagram) {
        let igLink = biz.instagram.startsWith('http') ? biz.instagram : 'https://' + biz.instagram;
        socialHtml += `<a href="${igLink}" target="_blank" class="social-link social-ig"><i class="fa-brands fa-instagram"></i></a>`;
      }
      if (biz.facebook) {
        let fbLink = biz.facebook.startsWith('http') ? biz.facebook : 'https://' + biz.facebook;
        socialHtml += `<a href="${fbLink}" target="_blank" class="social-link social-fb"><i class="fa-brands fa-facebook"></i></a>`;
      }
      if (biz.menu) {
        let webLink = biz.menu.startsWith('http') ? biz.menu : 'https://' + biz.menu;
        socialHtml += `<a href="${webLink}" target="_blank" class="social-link social-web"><i class="fa-solid fa-globe"></i></a>`;
      }
      socialContainer.innerHTML = socialHtml;

      document.getElementById('biz-desc').innerText = biz.desc || "Sin descripción";
      
      let statusText = "";
      if (biz.openTime && biz.closeTime) {
        const isOpenNow = checkIsOpen(biz.openTime, biz.closeTime);
        if (isOpenNow) statusText = "<span style='color:var(--success); font-weight:900;'>Abierto ahora</span> • ";
        else statusText = "<span style='color:var(--danger); font-weight:900;'>Cerrado</span> • ";
      }
      document.getElementById('biz-hours').innerHTML = `${statusText} ${biz.hoursDesc || 'Horarios a consultar'}`;
      
      document.getElementById('biz-address').innerText = biz.address || "Ubicación en mapa";

      const container = document.getElementById('biz-reviews-list'); container.innerHTML = "";
      const reviewsArr = biz.reviews ? Object.values(biz.reviews).sort((a,b) => b.timestamp - a.timestamp) : [];
      
      if (reviewsArr.length === 0) container.innerHTML = "<p class='slide-up' style='color:var(--text-muted); font-weight:600; text-align:center; margin-top:20px;'>Aún no hay proofs de este local.</p>";
      else {
        reviewsArr.forEach((r, index) => {
          let media = "";
          if (r.photoBase64) media += `<img src="${r.photoBase64}" onclick="window.openLightbox('${r.photoBase64}')" style="cursor:zoom-in;">`;
          if (r.audioBase64) media += `<audio controls src="${r.audioBase64}"></audio>`;
          let stars = `<div style="color:#F5A623; font-size:1.1rem;">` + `<i class="fa-solid fa-star"></i>`.repeat(r.rating || 5) + `</div>`;

          let safeAuthorPhoto = r.authorPhoto;
          if (!safeAuthorPhoto || (!safeAuthorPhoto.startsWith('http') && !safeAuthorPhoto.startsWith('data:image'))) safeAuthorPhoto = defaultImg;

          const div = document.createElement('div');
          div.className = 'review-card slide-up';
          div.style.animationDelay = `${index * 0.1}s`;
          div.innerHTML = `
            <div class="review-header"><img src="${safeAuthorPhoto}"><div><div class="review-author">${escapeHtml(r.authorName)}</div>${stars}</div></div>
            ${r.text ? `<div style="font-weight:600; font-size:1.05rem; color:#555;">${escapeHtml(r.text)}</div>` : ''}
            <div class="review-media">${media}</div>
          `;
          container.appendChild(div);
        });
      }
      window.openModal('modal-biz');
    };

    window.openMyProfile = function() {
      const container = document.getElementById('my-reviews-list');
      container.innerHTML = "";
      let count = 0;

      Object.entries(allBusinesses).forEach(([id, b]) => {
        if (b.reviews) {
          Object.values(b.reviews).forEach((r, index) => {
            if (r.authorUid === currentUser.uid) {
              count++;
              let media = "";
              if (r.photoBase64) media += `<img src="${r.photoBase64}" style="width:100%; border-radius:16px; margin-top:10px; cursor:zoom-in;" onclick="window.openLightbox('${r.photoBase64}')">`;
              
              const div = document.createElement('div');
              div.className = 'review-card slide-up';
              div.style.animationDelay = `${index * 0.1}s`;
              div.innerHTML = `
                <div style="font-weight:900; font-size:1.1rem; color:var(--primary); margin-bottom:8px;">${escapeHtml(b.name)}</div>
                <div style="color:#F5A623; margin-bottom:8px; font-size:1.1rem;"><i class="fa-solid fa-star"></i>`.repeat(r.rating || 5) + `</div>
                ${r.text ? `<div style="font-weight:600; color:#555;">${escapeHtml(r.text)}</div>` : ''}
                ${media}
              `;
              container.appendChild(div);
            }
          });
        }
      });

      if (count === 0) container.innerHTML = "<p style='color:#888; text-align:center;'>No has publicado ningún Proof aún.</p>";
      window.openModal('modal-profile');
    };

    window.startReviewWizard = function() {
      if (!currentUser) return window.openModal('modal-auth');
      wizRating = 0; document.querySelectorAll('#star-picker i').forEach(s => s.classList.remove('active'));
      document.getElementById('wiz-text').value = ''; document.getElementById('wiz-photo').value = ''; document.getElementById('wiz-photo-preview').style.display = 'none';
      recordedAudioBase64 = null; document.getElementById('wiz-audio-preview').style.display = 'none';
      window.nextWizardStep(1); window.openModal('modal-wizard');
    };
    function setupStarPicker() { document.querySelectorAll('#star-picker i').forEach(s => s.addEventListener('click', e => { wizRating = parseInt(e.target.getAttribute('data-val')); document.querySelectorAll('#star-picker i').forEach((st, idx) => { if(idx < wizRating) st.classList.add('active'); else st.classList.remove('active'); }); })); }
    window.nextWizardStep = function(s) { if(s===2 && wizRating===0) return showToast("Califica con estrellas primero"); document.querySelectorAll('.wizard-step').forEach(e => e.classList.remove('active')); document.getElementById('wiz-step-'+s).classList.add('active'); };
    window.previewWizPhoto = function(e) { if(e.target.files.length>0){ fileToBase64Compress(e.target.files[0]).then(b64 => { document.getElementById('wiz-photo-preview').src = b64; document.getElementById('wiz-photo-preview').style.display = 'block'; }); } };
    window.toggleWizAudio = async function() {
      const btn = document.getElementById('btn-wiz-audio'); const preview = document.getElementById('wiz-audio-preview');
      if(!isRecording) {
        try { const stream = await navigator.mediaDevices.getUserMedia({audio:true}); mediaRecorder = new MediaRecorder(stream); audioChunks = []; mediaRecorder.ondataavailable = e => audioChunks.push(e.data); mediaRecorder.onstop = () => { const blob = new Blob(audioChunks, {type:'audio/webm'}); const reader = new FileReader(); reader.onloadend = () => { recordedAudioBase64 = reader.result; preview.src = recordedAudioBase64; preview.style.display = "block"; }; reader.readAsDataURL(blob); }; mediaRecorder.start(); isRecording = true; btn.innerHTML = `<i class="fa-solid fa-stop" style="color:#D9534F;"></i> Detener Grabación`; } catch(e) { showToast("Sin micrófono"); }
      } else { mediaRecorder.stop(); isRecording = false; btn.innerHTML = `<i class="fa-solid fa-microphone"></i> Regrabar Audio`; }
    };
    window.submitWizardReview = async function() {
      const text = document.getElementById('wiz-text').value.trim(); const photoInput = document.getElementById('wiz-photo');
      const btn = document.getElementById('btn-wiz-submit'); btn.disabled = true; btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Publicando...`;
      try {
        let photoB64 = null; if (photoInput.files.length > 0) photoB64 = await fileToBase64Compress(photoInput.files[0]);
        await push(ref(db, `businesses/${selectedBizId}/reviews`), { authorUid: currentUser.uid, authorName: currentUser.name, authorPhoto: currentUser.photo, rating: wizRating, text, audioBase64: recordedAudioBase64, photoBase64: photoB64, timestamp: Date.now() });
        window.closeModal('modal-wizard'); window.openBusinessModal(selectedBizId); showToast("¡Proof guardado!");
      } catch(err) { showToast("Error al publicar"); } finally { btn.disabled = false; btn.innerHTML = `Publicar Proof <i class="fa-solid fa-paper-plane"></i>`; }
    };

    onAuthStateChanged(auth, user => {
      if (user) { onValue(ref(db, 'users/' + user.uid), s => { if(s.exists()){ currentUser = {uid:user.uid, email:user.email, ...s.val()}; updateAuthUI(); } }); } 
      else { currentUser = null; updateAuthUI(); }
    });
    window.registerUser = async function() {
      const n = document.getElementById('regName').value, e = document.getElementById('regEmail').value, p = document.getElementById('regPassword').value, f = document.getElementById('regPhoto').files[0];
      if(!n || !e || !p) return showToast("Faltan datos");
      try {
        let b64 = "https://via.placeholder.com/150/0F3473/FFFFFF?text="+n.charAt(0).toUpperCase(); 
        if(f) b64 = await fileToBase64Compress(f);
        const c = await createUserWithEmailAndPassword(auth, e, p);
        await set(ref(db, 'users/'+c.user.uid), {name:n, photo:b64, createdAt:Date.now()}); window.closeModal('modal-auth'); showToast("¡Cuenta habilitada!");
      } catch(err){ showToast("Error al registrar: " + err.message); }
    };
    window.loginUser = async function() { try{ await signInWithEmailAndPassword(auth, document.getElementById('loginEmail').value, document.getElementById('loginPassword').value); window.closeModal('modal-auth'); showToast("¡Bienvenido!"); } catch(e){ showToast("Datos incorrectos"); } };
    window.logoutUser = async function() { await signOut(auth); window.closeDrawer(); showToast("Sesión cerrada"); };
    function updateAuthUI() {
      if(currentUser) { document.getElementById('drawer-user-profile').style.display='block'; document.getElementById('drawer-avatar').src=currentUser.photo; document.getElementById('drawer-username').innerText=currentUser.name; document.getElementById('menu-text-auth').innerText="Mi Perfil / Reseñas"; document.getElementById('menu-btn-logout').style.display='flex'; }
      else { document.getElementById('drawer-user-profile').style.display='none'; document.getElementById('menu-text-auth').innerText="Iniciar Sesión / Registro"; document.getElementById('menu-btn-logout').style.display='none'; }
    }
    
    window.switchAuthTab = function(tab) { document.getElementById('loginForm').style.display = tab==='login'?'block':'none'; document.getElementById('registerForm').style.display = tab==='register'?'block':'none'; document.getElementById('tab-login').classList.toggle('active', tab==='login'); document.getElementById('tab-register').classList.toggle('active', tab==='register'); };
    window.startQrScanner = function() { window.openModal('modal-qr'); if(!html5QrCodeScanner){ html5QrCodeScanner = new Html5QrcodeScanner("qr-reader", {fps:10, qrbox:250}); html5QrCodeScanner.render(text => { window.closeModal('modal-qr'); html5QrCodeScanner.clear(); html5QrCodeScanner=null; try{ const u=new URL(text); const id=u.searchParams.get('biz'); if(id && allBusinesses[id]) window.openBusinessModal(id); else showToast("QR no válido para esta app"); }catch(e){ if(allBusinesses[text]) window.openBusinessModal(text); else showToast("Código no válido"); } }, ()=>{}); } };
    window.openModal = id => document.getElementById(id).classList.add('active');
    window.closeModal = id => document.getElementById(id).classList.remove('active');
    window.openDrawer = () => { document.getElementById('drawer').classList.add('active'); document.getElementById('drawer-overlay').classList.add('active'); };
    window.closeDrawer = () => { document.getElementById('drawer').classList.remove('active'); document.getElementById('drawer-overlay').classList.remove('active'); };
    window.handleMenuProfile = () => { window.closeDrawer(); if(currentUser) window.openMyProfile(); else window.openModal('modal-auth'); };
    function showToast(msg) { const t=document.getElementById('toast'); t.innerText=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 3000); }
    function escapeHtml(s) { return s?s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"):""; }
  </script>
</body>
</html>
