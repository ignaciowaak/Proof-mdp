<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Proof</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root { --bg-base: #F6f4F1; --primary: #0F3473; --white: #FFFFFF; }
    body { font-family: 'Outfit', sans-serif; background: var(--bg-base); padding: 20px; color: var(--primary); }
    .container { max-width: 800px; margin: 0 auto; background: var(--white); padding: 30px; border-radius: 24px; box-shadow: 0 12px 30px rgba(15,52,115,0.1); }
    h2 { font-weight: 900; margin-bottom: 24px; font-size: 1.8rem; text-transform: uppercase; letter-spacing: -0.5px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 800; margin-bottom: 8px; font-size: 0.95rem; }
    input, select, textarea { width: 100%; padding: 14px; border: 2px solid rgba(15,52,115,0.1); border-radius: 16px; font-size: 1rem; color: var(--primary); font-family: 'Outfit'; outline: none; transition: 0.3s; }
    input:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 4px 12px rgba(15,52,115,0.08); }
    #admin-map { height: 350px; border-radius: 16px; margin-top: 10px; border: 2px solid rgba(15,52,115,0.1); z-index: 1; }
    button { padding: 16px 24px; border: none; border-radius: 30px; background: var(--primary); color: var(--white); font-weight: 800; cursor: pointer; font-size: 1rem; transition: 0.3s; font-family: 'Outfit'; }
    button:hover { opacity: 0.9; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(15,52,115,0.2); }
    .btn-secondary { background: var(--bg-base); color: var(--primary); border: 2px solid var(--primary); }
    .btn-danger { background: #D9534F; color: white; padding: 10px 16px; font-size: 0.9rem; }
    .biz-item { display: flex; justify-content: space-between; align-items: center; padding: 20px; border: 2px solid rgba(15,52,115,0.1); border-radius: 20px; margin-bottom: 16px; background: #fafafa; }
    .qr-box { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
    .qr-box img { width: 150px; height: 150px; border-radius: 12px; border: 2px solid var(--primary); padding: 4px; background: white; }
    #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--primary); color: white; padding: 12px 24px; border-radius: 30px; font-weight: 800; display: none; z-index: 9999; }
    .domain-box { background: rgba(15,52,115,0.05); padding: 20px; border-radius: 16px; margin-bottom: 30px; border: 2px dashed var(--primary); }
  </style>
</head>
<body>

  <div id="toast">Notificación</div>

  <div class="container">
    <h2><i class="fa-solid fa-link"></i> Enlace Seguro de QR</h2>
    <div class="domain-box">
      <label>URL de Netlify (App Pública)</label>
      <input type="text" id="app-domain" placeholder="https://proofok.netlify.app" oninput="window.renderAdminList()">
      <p style="font-size:0.85rem; color:#666; margin-top:8px;">Asegúrate de poner tu enlace con <b>https://</b> aquí. Esto fuerza a los códigos QR de abajo a convertirse en enlaces de internet.</p>
    </div>

    <h2><i class="fa-solid fa-plus-circle"></i> Crear Local</h2>
    
    <div class="form-group"><label>Nombre del Local</label><input type="text" id="name" placeholder="Ej: Café Central"></div>
    <div class="form-group"><label>Foto Principal (El Pin del Mapa)</label><input type="file" id="photo" accept="image/*"></div>
    <div class="form-group"><label>Descripción</label><textarea id="desc" rows="3" placeholder="Restaurante de..."></textarea></div>
    
    <div style="display:flex; gap:16px;">
      <div class="form-group" style="flex:1;"><label>Categoría</label><select id="cat"><option>Gastronomía</option><option>Servicios</option><option>Comercio</option></select></div>
      <div class="form-group" style="flex:1;"><label>Horarios</label><input type="text" id="hours" placeholder="Ej: L a V 09:00 - 18:00"></div>
    </div>
    
    <div class="form-group"><label>Menú / Web</label><input type="text" id="menu" placeholder="https://..."></div>
    
    <div class="form-group" style="margin-top:20px;">
      <label>1. Dirección</label>
      <div style="display:flex; gap:10px;">
        <input type="text" id="address" placeholder="Ej: Güemes 1234">
        <button onclick="searchAddress()" class="btn-secondary">Buscar Mapa</button>
      </div>
    </div>
    
    <div class="form-group" style="margin-bottom:20px;">
      <label>2. O usar ubicación exacta (Si estás físicamente ahí)</label>
      <button onclick="useAdminGPS()" class="btn-secondary" style="width:100%;">📍 Capturar mi GPS</button>
    </div>
    
    <div id="admin-map"></div>
    <input type="hidden" id="lat"><input type="hidden" id="lng">
    
    <button onclick="saveBusiness()" style="width:100%; margin-top:30px; font-size:1.2rem;">Guardar y Crear Código QR</button>

    <h2 style="margin-top:60px;">Locales Registrados y QRs</h2>
    <div id="biz-list"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
    import { getDatabase, ref, push, set, onValue, remove } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js";

    const app = initializeApp({
      apiKey: "AIzaSyAhz1XHoprhhrHyYfuAdIYGMJxm5UsDO-4",
      databaseURL: "https://the-pic-c437e-default-rtdb.firebaseio.com",
      projectId: "the-pic-c437e",
    });
    const db = getDatabase(app);

    const currentOrigin = window.location.origin;
    if (currentOrigin.startsWith("http") && !currentOrigin.includes("localhost")) {
      document.getElementById('app-domain').value = currentOrigin;
    } else {
      document.getElementById('app-domain').value = "https://proofok.netlify.app";
    }

    let adminMap = L.map('admin-map').setView([-38.0055, -57.5426], 13);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(adminMap);
    let adminMarker = null;

    adminMap.on('click', (e) => { setMarker(e.latlng.lat, e.latlng.lng); document.getElementById('address').value = "Punto en el mapa"; });

    function setMarker(lat, lng) {
      document.getElementById('lat').value = lat; document.getElementById('lng').value = lng;
      if(adminMarker) adminMarker.setLatLng([lat, lng]); else adminMarker = L.marker([lat, lng]).addTo(adminMap);
      adminMap.setView([lat, lng], 16);
    }

    window.searchAddress = async function() {
      const q = document.getElementById('address').value; if(!q) return;
      showToast("Buscando...");
      const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}`);
      const data = await res.json();
      if(data.length > 0) { setMarker(parseFloat(data[0].lat), parseFloat(data[0].lon)); showToast("Ubicación encontrada"); }
      else showToast("No se encontró. Usa el GPS.");
    };

    window.useAdminGPS = function() {
      if ("geolocation" in navigator) {
        showToast("Conectando con GPS...");
        navigator.geolocation.getCurrentPosition((pos) => {
          setMarker(pos.coords.latitude, pos.coords.longitude);
          document.getElementById('address').value = "Ubicación GPS exacta";
          showToast("¡Ubicación GPS guardada!");
        }, (err) => { showToast("Error GPS."); }, { enableHighAccuracy: true });
      }
    };

    window.saveBusiness = async function() {
      const name = document.getElementById('name').value; const desc = document.getElementById('desc').value;
      const cat = document.getElementById('cat').value; const hours = document.getElementById('hours').value;
      const menu = document.getElementById('menu').value; const address = document.getElementById('address').value;
      const lat = parseFloat(document.getElementById('lat').value); const lng = parseFloat(document.getElementById('lng').value);
      const photoFile = document.getElementById('photo').files[0];

      if(!name || isNaN(lat)) return showToast("Falta el nombre o marcar en el mapa");
      
      let photoBase64 = null;
      if(photoFile) photoBase64 = await fileToBase64(photoFile);

      await push(ref(db, 'businesses'), { name, desc, category: cat, hours, address, menu, lat, lng, photoBase64, timestamp: Date.now() });
      showToast("Local guardado");
      document.querySelectorAll('input:not([type=hidden]), textarea').forEach(i => i.value='');
    };

    let globalBizData = {};
    onValue(ref(db, 'businesses'), (snapshot) => {
      globalBizData = snapshot.val() || {};
      window.renderAdminList();
    });

    window.renderAdminList = function() {
      const list = document.getElementById('biz-list'); list.innerHTML = "";
      
      let baseUrl = document.getElementById('app-domain').value.trim();
      if (baseUrl.endsWith('/')) baseUrl = baseUrl.slice(0, -1);
      if (!baseUrl.startsWith('http')) baseUrl = 'https://' + baseUrl; 

      const sortedBiz = Object.entries(globalBizData).sort((a, b) => (b[1].timestamp || 0) - (a[1].timestamp || 0));

      sortedBiz.forEach(([id, b]) => {
        // ENLACE 100% FUNCIONAL Y SEGURO (Deep Link)
        const qrUrl = `${baseUrl}/?biz=${id}`;
        const qrSrc = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(qrUrl)}&margin=10`;

        list.innerHTML += `
          <div class="biz-item">
            <div style="flex:1;">
              <h3 style="margin-bottom:8px; font-weight:900;">${b.name}</h3>
              <p style="margin-bottom:15px; font-size:0.9rem;">Dir: ${b.address}</p>
              <button class="btn-danger" onclick="window.deleteBiz('${id}')">Eliminar Local</button>
            </div>
            <div class="qr-box">
              <img src="${qrSrc}">
              <a href="${qrSrc}" target="_blank" style="color:var(--primary); font-weight:800; font-size:0.8rem; text-decoration:none; margin-top:5px;"><i class="fa-solid fa-download"></i> Descargar QR</a>
            </div>
          </div>`;
      });
    };

    window.deleteBiz = async function(id) { if(confirm("¿Eliminar este local de forma permanente?")) await remove(ref(db, 'businesses/'+id)); };
    function showToast(msg) { const t=document.getElementById('toast'); t.innerText=msg; t.style.display='block'; setTimeout(()=>t.style.display='none', 3000); }
    function fileToBase64(f) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => {
      const img = new Image(); img.onload = () => {
        const canvas = document.createElement('canvas'); const MAX = 600; const scale = img.width > MAX ? MAX / img.width : 1;
        canvas.width = img.width * scale; canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        res(canvas.toDataURL('image/jpeg', 0.8));
      }; img.src = r.result;
    }; r.onerror = rej; r.readAsDataURL(f); }); }
  </script>
</body>
</html>
